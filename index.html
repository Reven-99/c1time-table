<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Timetable · MCA 1(C) · C1</title>
<style>
:root{--bg:#f4f6ff;--card:#fff;--tx:#1b1f3b;--mu:#6b7280;--ac:#4f46e5;--pr:#0ea5e9;--th:#f59e0b;--bd:#e5e7eb;--fr:#f3f4f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#1a1e3a;--tx:#eef0ff;--mu:#9aa0c3;--ac:#818cf8;--bd:#2c3158;--fr:#161a33}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#1a1e3a;--tx:#eef0ff;--mu:#9aa0c3;--ac:#818cf8;--bd:#2c3158;--fr:#161a33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed,#0ea5e9);background-size:200% 200%;animation:g 8s ease infinite;color:#fff;border-radius:20px;padding:20px;position:relative}
@keyframes g{50%{background-position:100% 50%}}
h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
#th{position:absolute;top:14px;right:14px;background:#ffffff33;border:0;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
#clock{font-size:34px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
#now{margin:14px 0;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:16px;padding:14px 16px;animation:up .5s}
#now small{color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
#now b{display:block;font-size:18px;margin:2px 0}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .6s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs button,.vt button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;transition:.2s}
.tabs button.on,.vt button.on{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-2px)}
.tabs button.td::after{content:" •";color:var(--th)}
.vt{display:flex;gap:6px;margin:10px 0}
.c{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden;}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.t{width:84px;padding:12px;background:var(--fr);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center}
.m{padding:12px 12px 12px 0;flex:1}.m b{display:block}.m span{color:var(--mu);font-size:13px}
.c.p{border-left:5px solid var(--pr)}.c.h{border-left:5px solid var(--th)}.c.f{opacity:.55;border-left:5px solid var(--bd)}
.c.live{outline:2px solid var(--ac)}
.m span.tag{color:#fff}.tag{font-size:10px;border-radius:99px;padding:2px 8px;color:#fff;margin-left:6px;vertical-align:middle}
.sc{overflow-x:auto}table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px;font-size:12px;text-align:center}
th{background:var(--ac);color:#fff;padding:8px;border-radius:8px}th.td{background:var(--th)}
td{padding:8px 4px;border-radius:8px;background:var(--card);border:1px solid var(--bd);transition:.2s}
td.p{background:#0ea5e922}td.h{background:#f59e0b22}td.f{color:var(--mu);background:var(--fr)}td:hover{transform:scale(1.05)}
td.t0{font-weight:700;background:var(--fr)}
footer{color:var(--mu);font-size:12px;text-align:center;margin:18px 0}
</style></head><body><div class="w">
<header><button id="th" aria-label="Toggle theme">🌓</button><h1>MCA 1(C) · Batch C1</h1>
<p>Theory: Class 11 · Roll No 130–159</p><div id="clock"></div><p id="dt"></p></header>
<div id="now"></div>
<div class="vt"><button id="vd" class="on">Day view</button><button id="vw">Week view</button></div>
<div id="day"><div class="tabs" id="tabs"></div><div id="list"></div></div>
<div id="week" class="sc" hidden></div>
<footer>Theory from 17 Sep 2026 · Practical from 22 Sep 2026 · Python (MCA-416) faculty not listed on source</footer>
</div>
<script>
const D=["Mon","Tue","Wed","Thu","Fri","Sat"];
const S=[["10:00 – 12:00",10,12],["1:00 – 2:00",13,14],["2:00 – 3:00",14,15],["3:00 – 4:00",15,16],["4:00 – 6:00",16,18]];
const P=(n,c,l)=>({k:"p",n,c,l}),T=(c,f)=>({k:"h",n:c,l:f}),F={k:"f",n:"Free"};
const py=P("Python C1","MCA-416","Lab 6"),ds1=P("DS C1","MCA-414","Lab 4 · RRP"),ds2=P("DS C1","MCA-414","Lab 2 · RRP"),
j1=P("Java C1","MCA-412","Lab 3 · VAP"),j2=P("Java C1","MCA-412","Lab 1 · VAP"),cl=P("Cloud C1","MCA-418(B)","Lab 8 · ARP");
const A=T("MCA-411","VAP"),B=T("MCA-413","MNB"),Cc=T("MCA-415","DRN"),Dd=T("MCA-417","APP"),E=T("MCA-418(A)","ARP");
const TT=[[py,A,B,F,cl],[ds1,A,B,F,F],[j1,A,B,F,cl],[py,Cc,Dd,E,F],[j2,Cc,Dd,E,F],[ds2,Cc,Dd,E,F]];
const $=id=>document.getElementById(id);
const lbl=x=>x.k==="f"?"Free":x.k==="p"?`${x.n}`:x.n;
const sub=x=>x.k==="f"?"":x.k==="p"?`${x.c} · ${x.l}`:`Theory · ${x.l}`;
let sel=null,now=new Date();
const today=()=>{const g=now.getDay();return g===0?-1:g-1};
function tick(){now=new Date();$("clock").textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
$("dt").textContent=now.toLocaleDateString([],{weekday:"long",day:"numeric",month:"long",year:"numeric"});nowCard();if(sel!==null)render()}
function nowCard(){const d=today(),h=now.getHours()+now.getMinutes()/60,el=$("now");
if(d<0){el.innerHTML="<small>Today</small><b>Sunday – no classes 🎉</b>";return}
for(let i=0;i<5;i++){const [,a,b]=S[i],x=TT[d][i];if(h>=a&&h<b){const pc=Math.round((h-a)/(b-a)*100);
el.innerHTML=`<small>Happening now</small><b>${lbl(x)}</b><span>${sub(x)||"Enjoy your break"} · ${S[i][0]}</span><div class="bar"><i style="width:${pc}%"></i></div>`;return}}
for(let i=0;i<5;i++){const [,a]=S[i],x=TT[d][i];if(h<a&&x.k!=="f"){const m=Math.round((a-h)*60);
el.innerHTML=`<small>Up next · in ${m>=60?Math.floor(m/60)+"h "+m%60+"m":m+" min"}</small><b>${lbl(x)}</b><span>${sub(x)} · ${S[i][0]}</span>`;return}}
el.innerHTML="<small>Today</small><b>All done for today ✅</b>"}
function render(){const d=today(),h=now.getHours()+now.getMinutes()/60;
$("tabs").innerHTML=D.map((n,i)=>`<button class="${i===sel?"on":""} ${i===d?"td":""}" data-i="${i}">${n}</button>`).join("");
$("list").innerHTML=TT[sel].map((x,i)=>{const live=sel===d&&h>=S[i][1]&&h<S[i][2];
return `<div class="c ${x.k} ${live?"live":""}"><div class="t">${S[i][0].replace(" – ","<br>")}</div><div class="m"><b>${lbl(x)}${x.k==="p"?'<span class="tag" style="background:var(--pr)">PRACTICAL</span>':x.k==="h"?'<span class="tag" style="background:var(--th)">THEORY</span>':""}</b><span>${sub(x)}</span></div></div>`}).join("");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render()})}
function week(){const d=today();let h="<table><tr><th>Time</th>"+D.map((n,i)=>`<th class="${i===d?"td":""}">${n}</th>`).join("")+"</tr>";
S.forEach((s,r)=>{h+=`<tr><td class="t0">${s[0]}</td>`+D.map((_,c)=>{const x=TT[c][r];return `<td class="${x.k}">${x.k==="f"?"Free":`<b>${x.n}</b><br>${x.k==="p"?x.c+"<br>"+x.l:x.l}`}</td>`}).join("")+"</tr>"});
$("week").innerHTML=h+"</table>"}
$("vd").onclick=()=>{$("day").hidden=false;$("week").hidden=true;$("vd").classList.add("on");$("vw").classList.remove("on")};
$("vw").onclick=()=>{$("day").hidden=true;$("week").hidden=false;$("vw").classList.add("on");$("vd").classList.remove("on")};
$("th").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark"};
sel=today()<0?0:today();week();tick();setInterval(tick,1000);
</script></body></html>
